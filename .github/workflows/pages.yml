name: Pages

# Publish the standalone demo in demo/ to GitHub Pages.
# The upstream project website (site/) is not built here: this fork deploys one page.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'skills/answer-me-with-html-in-shimo-style/scripts/am.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render the demo from its draft
        env:
          AM_HOME: ${{ runner.temp }}/am-home
          AM_NO_UPDATE_CHECK: '1'
        run: >-
          node skills/answer-me-with-html-in-shimo-style/scripts/am.mjs
          render demo/index.md --theme shimo --mode light --no-open
          -o demo/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages on the first run if the repository has none yet.
          enablement: true
      - name: Upload the demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
